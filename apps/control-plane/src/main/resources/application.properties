quarkus.http.host=127.0.0.1
quarkus.http.port=8080
quarkus.http.test-port=0
aies.data.dir=${AIES_DATA_DIR:./data}
aies.scheduler.max-attempts=3
aies.scheduler.lease-seconds=${AIES_SCHEDULER_LEASE_SECONDS:300}
# Enable JSON logs later after adding quarkus-logging-json.

# v0.3: no fake completion; enable only when llama.cpp is running.
aies.model.enabled=${AIES_MODEL_ENABLED:false}
aies.model.base-url=${AIES_MODEL_BASE_URL:http://127.0.0.1:8081}
aies.model.name=${AIES_MODEL_NAME:local}
aies.model.timeout-seconds=${AIES_MODEL_TIMEOUT_SECONDS:90}

aies.tools.enabled=${AIES_TOOLS_ENABLED:false}
aies.tools.token=${AIES_TOOLS_TOKEN:}
aies.tools.workspace=${AIES_WORKSPACE:.}
aies.tools.python=${AIES_TOOLS_PYTHON:.aies/venv/bin/python}

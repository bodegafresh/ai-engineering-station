quarkus.http.host=127.0.0.1
quarkus.http.port=8080
quarkus.http.test-port=0
aies.data.dir=${AIES_DATA_DIR:./data}
aies.scheduler.max-attempts=3
aies.scheduler.lease-seconds=${AIES_SCHEDULER_LEASE_SECONDS:300}
# Enable JSON logs later after adding quarkus-logging-json.

# v0.3: no fake completion; enable only when llama.cpp is running.
aies.model.enabled=${AIES_MODEL_ENABLED:false}
aies.model.base-url=${AIES_MODEL_BASE_URL:http://127.0.0.1:11434}
aies.model.name=${AIES_MODEL_NAME:qwen3:4b}
aies.model.timeout-seconds=${AIES_MODEL_TIMEOUT_SECONDS:90}

aies.tools.enabled=${AIES_TOOLS_ENABLED:false}
aies.tools.token=${AIES_TOOLS_TOKEN:}
aies.tools.workspace=${AIES_WORKSPACE:.}
aies.tools.python=${AIES_TOOLS_PYTHON:.aies/venv/bin/python}

# v0.7: local first; explicit cloud opt-in only
aies.ai.default-provider=${AIES_AI_DEFAULT_PROVIDER:local}
aies.ai.cloud-enabled=${AIES_AI_CLOUD_ENABLED:false}
aies.ai.max-output-tokens=${AIES_AI_MAX_OUTPUT_TOKENS:512}

# v0.12: specialist prompt composition is explicitly opt-in.
aies.specialist.execution.enabled=${AIES_SPECIALIST_EXECUTION_ENABLED:false}

# v0.17: disabled until explicitly enabled and protected by a 32+ char token.
aies.memory.enabled=${AIES_MEMORY_ENABLED:false}
aies.memory.token=${AIES_MEMORY_TOKEN:}

# v0.18 opt-in team evaluation (local Ollama only)
aies.teams.enabled=${AIES_TEAMS_ENABLED:false}
aies.teams.token=${AIES_TEAMS_TOKEN:}
aies.teams.memory-enabled=${AIES_TEAMS_MEMORY_ENABLED:false}

# v0.19: opt-in bounded, read-only project snapshots
aies.teams.workspace-enabled=${AIES_TEAMS_WORKSPACE_ENABLED:false}
aies.teams.projects-root=${AIES_TEAMS_PROJECTS_ROOT:./projects}

# v0.20: human-approved local patching; disabled by default.
aies.patches.enabled=${AIES_PATCHES_ENABLED:false}
aies.patches.token=${AIES_PATCHES_TOKEN:}

# v0.23: Java-owned P0 control plane (disabled by default)

# v0.23: human-operated, opt-in isolated workspace changes.
aies.workspace-changes.enabled=${AIES_WORKSPACE_CHANGES_ENABLED:false}
aies.workspace-changes.token=${AIES_WORKSPACE_CHANGES_TOKEN:}
aies.workspace-changes.sessions-root=${AIES_WORKSPACE_CHANGES_SESSIONS_ROOT:./data/workspace-sessions}

# v0.25: operator-only verification in a network-disabled Docker container.
aies.workspace-verification.enabled=${AIES_WORKSPACE_VERIFICATION_ENABLED:false}
aies.workspace-verification.image=${AIES_WORKSPACE_VERIFICATION_IMAGE:}

# P0.4: operator-only internal communication contracts (no autonomous execution)
aies.agent-communications.enabled=${AIES_AGENT_COMMUNICATIONS_ENABLED:false}
aies.agent-communications.data-root=${AIES_AGENT_COMMUNICATIONS_DATA_ROOT:./data/agent-communications}

# P0.5: bounded structural audits transported via Vert.x local Event Bus
aies.agent-communications.audit-max-iterations=${AIES_AGENT_COMMUNICATIONS_AUDIT_MAX_ITERATIONS:3}

# P0.6-P0.7: opt-in durable scientific workflows via Vert.x Event Bus
aies.science.enabled=${AIES_SCIENCE_ENABLED:false}
aies.science.outbox.poll-ms=${AIES_SCIENCE_OUTBOX_POLL_MS:2000}

# P0.8 opt-in semantic audit, fails closed when model is unavailable
aies.semantic-audit.enabled=${AIES_SEMANTIC_AUDIT_ENABLED:false}
aies.semantic-audit.timeout-seconds=${AIES_SEMANTIC_AUDIT_TIMEOUT_SECONDS:45}

# P0.9 opt-in specialist capability selection over Vert.x Event Bus
aies.specialists.enabled=${AIES_SPECIALISTS_ENABLED:false}

# P0.12-P0.13: opt-in audited scientific plan delivery and product analytics
aies.factory.enabled=${AIES_FACTORY_ENABLED:false}

# P0.14-17: universal planning intake, requirements, DAG, audit controller
aies.planning.enabled=${AIES_PLANNING_ENABLED:false}
aies.planning.poll-ms=${AIES_PLANNING_POLL_MS:2000}

aies.execution.handoff.enabled=${AIES_EXECUTION_HANDOFF_ENABLED:false}

# P1.4 opt-in internal dispatch; no tool execution
aies.execution.dispatch.enabled=false
aies.execution.max-attempts=3
aies.execution.lease-seconds=60

# Hito D: explicit opt-in worker; requires real specialist Event Bus consumer
aies.execution.worker.enabled=${AIES_EXECUTION_WORKER_ENABLED:false}
aies.execution.worker.timeout-seconds=${AIES_EXECUTION_WORKER_TIMEOUT_SECONDS:30}

# P1.5 opt-in evidence verification and audit gate
aies.execution.quality.enabled=${AIES_EXECUTION_QUALITY_ENABLED:false}
aies.execution.quality.timeout-seconds=${AIES_EXECUTION_QUALITY_TIMEOUT_SECONDS:90}

# F2: explicit operator-approved workspace documentation; disabled by default.
aies.execution.documentation.enabled=${AIES_EXECUTION_DOCUMENTATION_ENABLED:false}
aies.execution.documentation.workspace-root=${AIES_EXECUTION_DOCUMENTATION_WORKSPACE_ROOT:./projects}
aies.execution.documentation.timeout-seconds=${AIES_EXECUTION_DOCUMENTATION_TIMEOUT_SECONDS:90}

# F4.3-B operator-only read-only acceptance endpoint; disabled by default.
aies.execution.acceptance.enabled=${AIES_EXECUTION_ACCEPTANCE_ENABLED:false}
